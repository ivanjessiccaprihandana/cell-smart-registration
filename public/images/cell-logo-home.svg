<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
    <title id="title">CELL Fun n Easy English</title>
    <desc id="desc">Logo CELL dengan lingkaran ungu dan teks Fun n Easy English.</desc>
    <defs>
        <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="58%" stop-color="#f7f8fc"/>
            <stop offset="100%" stop-color="#eef2ff"/>
        </radialGradient>
        <linearGradient id="disc" x1="18%" x2="82%" y1="16%" y2="84%">
            <stop offset="0%" stop-color="#4c35a5"/>
            <stop offset="52%" stop-color="#34217b"/>
            <stop offset="100%" stop-color="#21165f"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.22"/>
        </filter>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#111827" flood-opacity="0.28"/>
        </filter>
    </defs>

    <rect width="900" height="900" fill="url(#bgGlow)"/>
    <g opacity="0.58" filter="url(#softShadow)">
        <rect x="645" y="64" width="164" height="198" rx="30" fill="#ffffff" transform="rotate(16 727 163)"/>
        <rect x="680" y="93" width="94" height="22" rx="11" fill="#c7d2fe"/>
        <rect x="676" y="135" width="78" height="20" rx="10" fill="#ddd6fe"/>
        <rect x="673" y="177" width="112" height="20" rx="10" fill="#fde68a"/>
        <circle cx="790" cy="220" r="20" fill="#fdba74"/>
        <circle cx="116" cy="318" r="20" fill="#fdba74" opacity="0.5"/>
        <circle cx="87" cy="378" r="22" fill="#fecaca" opacity="0.45"/>
    </g>

    <g filter="url(#shadow)">
        <circle cx="450" cy="360" r="250" fill="url(#disc)"/>
        <path d="M234 250C320 202 421 174 533 168" fill="none" stroke="#a5b4fc" stroke-width="4" opacity="0.48"/>
        <path d="M211 318C323 254 458 218 614 211" fill="none" stroke="#a5b4fc" stroke-width="4" opacity="0.42"/>
        <path d="M229 413C351 336 495 287 660 269" fill="none" stroke="#a5b4fc" stroke-width="4" opacity="0.36"/>
        <path d="M298 545C421 453 548 385 694 342" fill="none" stroke="#a5b4fc" stroke-width="4" opacity="0.34"/>

        <text x="450" y="435" text-anchor="middle"
              font-family="Arial Black, Arial, Helvetica, sans-serif"
              font-size="186" font-weight="900" fill="#ffffff"
              stroke="#f8fafc" stroke-width="5" paint-order="stroke fill">
            Cell
        </text>
    </g>

    <text x="450" y="735" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="72" font-weight="400" letter-spacing="1"
          fill="#2f3037">
        Fun 'n Easy English
    </text>

</svg>
