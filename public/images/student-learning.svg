<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#f0f4f8"/>
  
  <!-- Window frame -->
  <rect x="80" y="100" width="280" height="220" fill="#4a7c7e" rx="10"/>
  <line x1="220" y1="100" x2="220" y2="320" stroke="#8fb3b5" stroke-width="3"/>
  <line x1="80" y1="190" x2="360" y2="190" stroke="#8fb3b5" stroke-width="3"/>
  <line x1="80" y1="210" x2="360" y2="210" stroke="#8fb3b5" stroke-width="3"/>
  
  <!-- Window panes glow -->
  <rect x="90" y="110" width="130" height="100" fill="#ffb347" opacity="0.3" rx="5"/>
  <rect x="230" y="110" width="120" height="100" fill="#ffa500" opacity="0.2" rx="5"/>
  
  <!-- Desk -->
  <ellipse cx="300" cy="420" rx="180" ry="50" fill="#6b5b4d"/>
  <rect x="120" y="400" width="360" height="60" fill="#8b7355" rx="5"/>
  
  <!-- Chair back -->
  <ellipse cx="250" cy="300" rx="60" ry="80" fill="#1e5f6b"/>
  
  <!-- Student figure -->
  <!-- Head -->
  <circle cx="250" cy="220" r="35" fill="#d4a574"/>
  
  <!-- Hair -->
  <path d="M 215 220 Q 215 185 250 185 Q 285 185 285 220" fill="#8b5a3c"/>
  <path d="M 285 220 Q 290 215 295 225" fill="#8b5a3c"/>
  
  <!-- Headphones -->
  <circle cx="220" cy="205" r="12" fill="#c41e3a" stroke="#8b0000" stroke-width="2"/>
  <circle cx="280" cy="205" r="12" fill="#c41e3a" stroke="#8b0000" stroke-width="2"/>
  <path d="M 220 205 Q 250 180 280 205" stroke="#8b0000" stroke-width="3" fill="none"/>
  
  <!-- Headphone band -->
  <path d="M 220 193 Q 250 170 280 193" stroke="#8b0000" stroke-width="2" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="240" cy="215" r="3" fill="#2c2c2c"/>
  <circle cx="260" cy="215" r="3" fill="#2c2c2c"/>
  
  <!-- Mouth -->
  <path d="M 240 230 Q 250 235 260 230" stroke="#2c2c2c" stroke-width="1.5" fill="none"/>
  
  <!-- Hoodie/Jacket -->
  <path d="M 215 255 L 210 350 Q 250 360 290 350 L 285 255 Z" fill="#2d6a7f"/>
  <path d="M 225 255 L 220 310 Q 250 315 280 310 L 275 255 Z" fill="#3a8fa0"/>
  
  <!-- Arms -->
  <!-- Left arm -->
  <path d="M 220 270 L 180 320" stroke="#d4a574" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Right arm -->
  <path d="M 280 270 L 360 280" stroke="#d4a574" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="175" cy="325" r="12" fill="#d4a574"/>
  <circle cx="365" cy="283" r="12" fill="#d4a574"/>
  
  <!-- Laptop -->
  <rect x="320" y="300" width="140" height="90" fill="#2c3e50" rx="8"/>
  <rect x="325" y="305" width="130" height="75" fill="#34495e" rx="6"/>
  
  <!-- Screen glow -->
  <rect x="330" y="310" width="120" height="65" fill="#87ceeb" opacity="0.6" rx="4"/>
  
  <!-- Keyboard -->
  <rect x="320" y="390" width="140" height="20" fill="#1a1a1a" rx="3"/>
  <circle cx="330" cy="400" r="2" fill="#666"/>
  <circle cx="345" cy="400" r="2" fill="#666"/>
  <circle cx="360" cy="400" r="2" fill="#666"/>
  <circle cx="375" cy="400" r="2" fill="#666"/>
  <circle cx="390" cy="400" r="2" fill="#666"/>
  <circle cx="405" cy="400" r="2" fill="#666"/>
  <circle cx="420" cy="400" r="2" fill="#666"/>
  <circle cx="435" cy="400" r="2" fill="#666"/>
  <circle cx="450" cy="400" r="2" fill="#666"/>
  
  <!-- Books/Stack on desk -->
  <rect x="100" y="385" width="35" height="30" fill="#d32f2f" rx="2"/>
  <rect x="105" y="378" width="35" height="30" fill="#1976d2" rx="2"/>
  <rect x="110" y="371" width="35" height="30" fill="#388e3c" rx="2"/>
  
  <!-- Cup with pencils -->
  <rect x="480" y="375" width="35" height="40" fill="#c41e3a" rx="3"/>
  <line x1="485" y1="370" x2="485" y2="350" stroke="#ffb300" stroke-width="2"/>
  <line x1="495" y1="368" x2="495" y2="345" stroke="#ff6f00" stroke-width="2"/>
  <line x1="505" y1="370" x2="505" y2="350" stroke="#f57c00" stroke-width="2"/>
  <line x1="515" y1="372" x2="515" y2="352" stroke="#e65100" stroke-width="2"/>
</svg>